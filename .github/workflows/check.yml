name: Native library and upload checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Resolve and build
        run: |
          moon version --all
          moon update
          moon fmt --check
          moon check --target native --deny-warn
          moon test --target native
          moon build --target native
          moon build --target native --release
          moon run cmd/consumer --target native
          npm ci --prefix tools --ignore-scripts
      - name: HTTP interoperability and process crash recovery
        run: python3 tools/verify.py --big-mib 1280
      - name: Native CLI large upload, restart, download and hash verification
        run: python3 tools/cli-verify.py --big-mib 1280
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-prototype-verification
          path: |
            output/**/verification.json
            output/**/failure.json
            output/**/server.log
            output/**/large-cli.log
            output/**/resume-cli.log
          if-no-files-found: ignore

  relay-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native tools and test SSH daemon
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          sudo apt-get update -qq
          sudo apt-get install -y openssh-server
          sudo mkdir -p /run/sshd
      - name: Build public libraries and unified CLI
        run: |
          moon update
          moon fmt --check
          moon check --target native --deny-warn
          moon test --target native
          moon build --target native --release
      - name: Recursive directory interruption and conflict checks
        run: |
          tools/build-cli.sh
          python3 tools/tree-verify.py
          python3 tools/download-verify.py
          python3 tools/maintenance-verify.py
      - name: Real SSH, bidirectional recovery and independent library consumer
        run: python3 tools/relay-verify.py --real-ssh --big-mib 1280 --consumer
      - name: Third-party MoonDocKit registry integration and interrupted delivery
        run: python3 tools/docsite-local-verify.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-relay-verification
          path: |
            output/**/verification.json
            output/**/failure.json
            output/**/sshd.log
          if-no-files-found: ignore

  windows-client:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install MoonBit
        shell: pwsh
        run: |
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$env:USERPROFILE\.moon\bin" >> $env:GITHUB_PATH
      - name: Build and check native Windows client
        shell: pwsh
        run: |
          moon update
          if ($LASTEXITCODE -ne 0) { throw 'Dependency resolution failed' }
          moon check --target native --deny-warn
          if ($LASTEXITCODE -ne 0) { throw 'Native check failed' }
          moon test --target native
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
          ./tools/build-cli.ps1
      - name: Native Windows file and HTTP workflows
        run: python tools/windows-verify.py
      - name: HTTP download recovery and active locking
        run: python tools/download-verify.py
      - name: HTTP task inventory and cleanup
        run: python tools/maintenance-verify.py
      - uses: actions/upload-artifact@v4
        with:
          name: moonrelay-windows-client
          path: bin/*.exe
